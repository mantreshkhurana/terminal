name: terminal
description: This is a simple yet customizable terminal emulator written in Flutter.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  xterm: ^4.0.0
  dartssh2: ^2.5.0
  flutter_pty: ^0.4.0
  after_layout: ^1.1.0
  file_picker: ^8.0.6
  path: ^1.8.2
  bitsdojo_window: ^0.1.5
  rename: ^3.0.2
  shared_preferences: ^2.2.2
  http: ^1.1.0
  provider: ^6.1.1
  flex_color_picker: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  lints: ^4.0.0
  # dart_code_metrics: ^4.16.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Cascadia Mono
      fonts:
        - asset: fonts/CascadiaMonoPL.ttf
